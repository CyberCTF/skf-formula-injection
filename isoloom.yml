# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Formula Injection (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask page store that exports user-written pages to a spreadsheet without neutralising formulas (CSV / formula injection). The SKF lab folder python/Formula-injection is
# vendored unchanged in build/web/app/ and built by an overlay of its Dockerfile (build/web/Dockerfile).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-formula-injection

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.169.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: pages can be added and exported as a spreadsheet
    script: checks/export.sh

message: |
  OWASP SKF Formula Injection answers at {{ machines.web.ports.web.url }}.
  Whatever you write in a page ends up in a cell of the export at /pages/export.
